spring:
  application:
    name: backend
  datasource:
    url: jdbc:sqlite:${DATA_DIR:../data}/codeoffer.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 并发写时等待锁最多 5 秒,避免直接 SQLITE_BUSY 报错
      connection-init-sql: "PRAGMA busy_timeout=5000"
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  mvc:
    static-path-pattern: /**

ai-service:
  url: ${AI_SERVICE_URL:http://127.0.0.1:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
