# 测试 profile:使用 H2 内存库,与运行库 MySQL 完全隔离
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET DEFAULT_LOCK_TIMEOUT 5000"
  jpa:
    hibernate:
      ddl-auto: create-drop

ai-service:
  url: http://127.0.0.1:8001

auth:
  rate-limit:
    per-minute: 10000

