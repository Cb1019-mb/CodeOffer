services:
  ai-service:
    build: ./ai-service
    container_name: codeoffer-ai
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./config/.env
    volumes:
      - ./data/repos:/data/repos
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: codeoffer-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - ai-service
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./data:/data
    restart: unless-stopped
