services:
  mysql:
    image: mysql:8.4
    container_name: codeoffer-mysql
    env_file:
      # 提供 MYSQL_USER / MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD
      - path: ./config/.env
        required: false
    environment:
      - MYSQL_DATABASE=${MYSQL_DB:-codeoffer}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: codeoffer-ai
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    env_file:
      # config/.env 不入库,全新 clone 上可能缺失;required:false 允许缺省启动
      - path: ./config/.env
        required: false
    volumes:
      - ./data/repos:/data/repos
    environment:
      - REPO_DATA_DIR=/data/repos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: codeoffer-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - path: ./config/.env
        required: false
    depends_on:
      ai-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      - AI_SERVICE_URL=http://ai-service:8001
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  mysql-data:
